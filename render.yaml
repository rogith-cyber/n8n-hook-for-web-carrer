services:
  - type: web
    name: careerpath-n8n
    env: docker

    plan: free

    autoDeploy: true

    envVars:
      - key: N8N_HOST
        value: careerpath-n8n.onrender.com

      - key: WEBHOOK_URL
        value: https://careerpath-n8n.onrender.com/

      - key: N8N_PROTOCOL
        value: https

      - key: N8N_PORT
        value: 5678

      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata

      - key: N8N_SECURE_COOKIE
        value: false

      - key: N8N_RUNNERS_ENABLED
        value: true